name: Sync Brassbell iCal

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22+ has native WebSocket (required by @supabase/supabase-js)
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Scrape brassbell.net and build feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.js

      - name: Wire feed URLs into listing_ical
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node wire.js

      - name: Commit updated feeds
        run: |
          git config user.name  "brassbell-ical[bot]"
          git config user.email "brassbell-ical@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: sync brassbell ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Robust push: a concurrent run (or a manual push) may have moved main.
          # Retry, integrating remote each time and preferring our freshly-built feeds.
          for i in 1 2 3 4 5; do
            git push && { echo "Pushed (attempt $i)."; exit 0; }
            echo "Push rejected; integrating remote and retrying ($i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
          done
          echo "ERROR: push failed after 5 attempts"; exit 1
