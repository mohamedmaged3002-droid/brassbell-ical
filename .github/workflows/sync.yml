name: Sync Brassbell iCal

on:
  schedule:
    # Every 2 hours, at :23 — NOT :00. Brassbell-direct bookings must reach the
    # OTAs before they resell the dates, and the whole chain is scrape -> Pages
    # -> the OTA's own poll. Minute :23 is deliberate: GitHub deprioritises cron
    # on public repos and the top of the hour is the global stampede; every :00
    # run in July 2026 started 1h17m-2h38m late, which was as much staleness as
    # the 6h interval itself. Re-check the real start times before tuning further.
    - cron: '23 */2 * * *'
  workflow_dispatch:

# Only one job may scrape brassbell.net at a time — the group is deliberately
# SHARED with prices.yml. The site volume-throttles (see src/config.js: the
# UNIT*NIGHT product ~18 tripped it), so sync's ~10 in-flight probes on top of
# a running price scrape would push us over. At the old 6h cadence the two
# never happened to collide; at 2h they will.
# cancel-in-progress MUST stay false: a sync firing mid-price-run would
# otherwise cancel the 30-minute price scrape and its change email. Queueing
# costs at most one delayed run and GitHub only ever holds one pending run.
concurrency:
  group: brassbell-scrape
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22+ has native WebSocket (required by @supabase/supabase-js)
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Scrape brassbell.net and build feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.js

      - name: Wire feed URLs into listing_ical
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node wire.js

      - name: Commit updated feeds
        run: |
          git config user.name  "brassbell-ical[bot]"
          git config user.email "brassbell-ical@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: sync brassbell ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Robust push: a concurrent run (or a manual push) may have moved main.
          # Retry, integrating remote each time and preferring our freshly-built feeds.
          for i in 1 2 3 4 5; do
            git push && { echo "Pushed (attempt $i)."; exit 0; }
            echo "Push rejected; integrating remote and retrying ($i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
          done
          echo "ERROR: push failed after 5 attempts"; exit 1
