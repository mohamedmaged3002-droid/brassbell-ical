name: Sync Brassbell iCal

on:
  schedule:
    # HOURLY at :23 — NOT :00. Brassbell-direct bookings must reach the OTAs
    # before they resell the dates, and the whole chain is scrape -> Pages ->
    # the OTA's own poll. Minute :23 is deliberate: GitHub deprioritises cron on
    # public repos and the top of the hour is the global stampede.
    #
    # 2026-08-01: the :23 offset was MEASURED over 20 scheduled runs and did not
    # fix the lag — mean gap 3.10h, max 4.46h against the 2h cron, because GitHub
    # *drops* roughly a third of scheduled runs rather than merely delaying them.
    # Halving the interval is the lever that survives dropped runs: at hourly we
    # expect ~14-16 real runs/day (vs ~7-8) and a mean gap near 1.5h.
    #
    # Cost: brassbell.net sees ~2x the scrape volume (~3h/day of probing at the
    # realised run rate, vs ~1.5-2h now). That is the thing to watch — src/config.js
    # records that a UNIT*NIGHT product ~18 tripped the site's throttle. If we do
    # trip it the failure is SAFE, not silent: src/guard.js refuses to write on
    # low-coverage / too-many-errors, so a throttled run keeps the last-good .ics
    # and names itself in docs/report.json -> skipped[]. Watch that array and the
    # 'Alarm on stale feeds' step for a week before considering sub-hourly.
    - cron: '23 * * * *'
  workflow_dispatch:

# Only one job may scrape brassbell.net at a time — the group is deliberately
# SHARED with prices.yml. The site volume-throttles (see src/config.js: the
# UNIT*NIGHT product ~18 tripped it), so sync's ~10 in-flight probes on top of
# a running price scrape would push us over. At the old 6h cadence the two
# never happened to collide; at 2h they will.
# cancel-in-progress MUST stay false: a sync firing mid-price-run would
# otherwise cancel the 30-minute price scrape and its change email. Queueing
# costs at most one delayed run and GitHub only ever holds one pending run.
concurrency:
  group: brassbell-scrape
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22+ has native WebSocket (required by @supabase/supabase-js)
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Scrape brassbell.net and build feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.js

      - name: Wire feed URLs into listing_ical
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node wire.js

      - name: Commit updated feeds
        run: |
          git config user.name  "brassbell-ical[bot]"
          git config user.email "brassbell-ical@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: sync brassbell ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Robust push: a concurrent run (or a manual push) may have moved main.
          # Retry, integrating remote each time and preferring our freshly-built feeds.
          for i in 1 2 3 4 5; do
            git push && { echo "Pushed (attempt $i)."; exit 0; }
            echo "Push rejected; integrating remote and retrying ($i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
          done
          echo "ERROR: push failed after 5 attempts"; exit 1

      # LAST, deliberately: this step FAILS the run when a feed has gone stale, and
      # it must not be able to cost us the push above (L-062 — outward-facing step
      # goes last). A red run here means feeds were published fine but at least one
      # unit is serving months-old availability to the OTAs. See L-074.
      - name: Alarm on stale feeds
        run: node check-stale.js
