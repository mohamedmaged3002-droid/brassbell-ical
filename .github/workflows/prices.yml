name: Sync Brassbell Prices

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape + log only, no DB writes / no sheet / no email'
        type: boolean
        default: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22+ has native WebSocket (required by @supabase/supabase-js)
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: pip install --quiet openpyxl
      - run: npx playwright install --with-deps chromium

      - name: Scrape brassbell.net + refresh unit_daily_prices (+ write sheet/change artifacts)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FX_RATE: '50'   # pinned USD->EGP for the website (operator choice 2026-06-25)
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SHEET_URL: 'https://drive.google.com/file/d/1h0QgMkCtIQ6yFtLldvCAVPkuxdvGUEPe/view'
        run: node prices-sync.js

      - name: Rebuild the OTA price sheet (xlsx)
        if: ${{ inputs.dry_run != true }}
        run: python build-sheet.py

      - name: Build the "changed units only" sheet (for the email)
        if: ${{ inputs.dry_run != true }}
        run: python build-changes.py

      - name: Re-upload the sheet to the same Drive file (keeps the share link current)
        if: ${{ inputs.dry_run != true }}
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          rclone copyto "Brassbell Onboarding OTAs - Full (iCal, Photos, Price).xlsx" \
            "gdrive:BlueKeys Photos/Brassbell Onboarding OTAs - Full (iCal, Photos, Price).xlsx" -v

      - name: Email the sheet — only when a price actually changed
        if: ${{ inputs.dry_run != true }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: 'reservations@bluekeys.co, Youssefelsamanody58@gmail.com, mfikry772007@gmail.com'
        run: node send-alert.js
